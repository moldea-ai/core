        run: >-
          node projects/adapter-openai-agents-sdk/scripts/runtime-compatibility/index.mjs
          "${{ runner.temp }}/public-package-tarballs"

  adapter-claude-agent-sdk-runtime-compatibility:
    name: Claude Agent SDK Adapter Runtime (Node.js ${{ matrix.node-version }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.11.0
