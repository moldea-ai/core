  adapter-openai-agents-sdk-runtime-compatibility:
    name: OpenAI Agents SDK Adapter Runtime (Node.js ${{ matrix.node-version }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
