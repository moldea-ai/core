name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: 24.15.0
  PNPM_VERSION: 11.9.0

jobs:
  verify:
    name: Verify Repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Runtime Compatibility Artifacts
        run: pnpm compatibility:check

      - name: Check Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Pack Repository FS Runtime Artifacts
        run: |
          runtime_packages_directory="${{ runner.temp }}/repository-fs-runtime-packages"
          mkdir -p "$runtime_packages_directory"
          pnpm --dir projects/repository pack --pack-destination "$runtime_packages_directory"
          pnpm --dir projects/repository-fs pack --pack-destination "$runtime_packages_directory"

      - name: Upload Repository FS Runtime Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: repository-fs-runtime-packages
          path: ${{ runner.temp }}/repository-fs-runtime-packages/*.tgz
          if-no-files-found: error

  repository-fs-runtime-compatibility:
    name: Repository FS Runtime (Node.js ${{ matrix.node-version }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.11.0
          - 22.x
          - 24.11.0
          - 24.x
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download Repository FS Runtime Artifacts
        uses: actions/download-artifact@v8
        with:
          name: repository-fs-runtime-packages
          path: ${{ runner.temp }}/repository-fs-runtime-packages

      - name: Test Packed Repository FS Runtime
        run: >-
          node projects/repository-fs/scripts/runtime-compatibility/index.mjs
          "${{ runner.temp }}/repository-fs-runtime-packages"

  test-cross-platform:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
