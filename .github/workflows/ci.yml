          - 24.x
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download Claude Agent SDK Adapter Runtime Artifacts
        uses: actions/download-artifact@v8
        with:
          name: public-package-tarballs
