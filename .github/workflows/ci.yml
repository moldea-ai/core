      - name: Test Packed Anthropic Adapter Runtime
        run: >-
          node projects/adapter-anthropic/scripts/runtime-compatibility/index.mjs
          "${{ runner.temp }}/public-package-tarballs"

  test-cross-platform:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js with dependency caching
        if: ${{ inputs.release_build != true }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Node.js for a release build
        if: ${{ inputs.release_build == true }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Website Browser
        run: pnpm --filter @moldea.ai/packages-website exec playwright install chromium

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
