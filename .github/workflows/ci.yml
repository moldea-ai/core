      - name: Test Packed Claude Agent SDK Adapter Runtime
        run: >-
          node projects/adapter-claude-agent-sdk/scripts/runtime-compatibility/index.mjs
          "${{ runner.temp }}/public-package-tarballs"

  adapter-anthropic-runtime-compatibility:
    name: Anthropic Adapter Runtime (Node.js ${{ matrix.node-version }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
