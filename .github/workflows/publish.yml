name: Publish npm Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      project:
        description: Public package project to bootstrap or recover.
        required: true
        type: choice
        options:
          - repository
          - repository-fs
          - core
          - adapter-anthropic
          - adapter-google-genai
          - adapter-openai
          - adapter-openai-agents-sdk
          - adapter-claude-agent-sdk
          - adapter-cloudflare-agents
          - adapter-eve
          - adapter-vercel-ai-sdk
          - cli
          - website-ui
      mode:
        description: Bootstrap creates the tag and artifact; trusted also publishes through OIDC.
        required: true
        type: choice
        options:
          - bootstrap
          - trusted

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: 24.15.0
  PNPM_VERSION: 11.9.0

jobs:
  plan:
    name: Plan npm Releases
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      adapter_anthropic: ${{ steps.release.outputs.adapter_anthropic }}
      adapter_anthropic_previous_version: ${{ steps.release.outputs.adapter_anthropic_previous_version }}
      adapter_claude_agent_sdk: ${{ steps.release.outputs.adapter_claude_agent_sdk }}
      adapter_claude_agent_sdk_previous_version: ${{ steps.release.outputs.adapter_claude_agent_sdk_previous_version }}
      adapter_cloudflare_agents: ${{ steps.release.outputs.adapter_cloudflare_agents }}
      adapter_cloudflare_agents_previous_version: ${{ steps.release.outputs.adapter_cloudflare_agents_previous_version }}
      adapter_eve: ${{ steps.release.outputs.adapter_eve }}
      adapter_eve_previous_version: ${{ steps.release.outputs.adapter_eve_previous_version }}
      adapter_google_genai: ${{ steps.release.outputs.adapter_google_genai }}
      adapter_google_genai_previous_version: ${{ steps.release.outputs.adapter_google_genai_previous_version }}
      adapter_openai: ${{ steps.release.outputs.adapter_openai }}
      adapter_openai_previous_version: ${{ steps.release.outputs.adapter_openai_previous_version }}
      adapter_openai_agents_sdk: ${{ steps.release.outputs.adapter_openai_agents_sdk }}
      adapter_openai_agents_sdk_previous_version: ${{ steps.release.outputs.adapter_openai_agents_sdk_previous_version }}
      adapter_vercel_ai_sdk: ${{ steps.release.outputs.adapter_vercel_ai_sdk }}
      adapter_vercel_ai_sdk_previous_version: ${{ steps.release.outputs.adapter_vercel_ai_sdk_previous_version }}
      cli: ${{ steps.release.outputs.cli }}
      core: ${{ steps.release.outputs.core }}
      has_releases: ${{ steps.release.outputs.has_releases }}
      mode: ${{ steps.release.outputs.mode }}
      project_key: ${{ steps.release.outputs.project_key }}
      projects: ${{ steps.release.outputs.projects }}
      repository: ${{ steps.release.outputs.repository }}
      repository_previous_version: ${{ steps.release.outputs.repository_previous_version }}
      repository_fs: ${{ steps.release.outputs.repository_fs }}
      repository_fs_previous_version: ${{ steps.release.outputs.repository_fs_previous_version }}
      website_ui: ${{ steps.release.outputs.website_ui }}
      website_ui_previous_version: ${{ steps.release.outputs.website_ui_previous_version }}
      cli_previous_version: ${{ steps.release.outputs.cli_previous_version }}
      core_previous_version: ${{ steps.release.outputs.core_previous_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Release Tooling
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Plan Changed Package Releases
        id: release
        env:
          RELEASE_BASE_COMMIT: ${{ github.event.before || '' }}
          RELEASE_MODE: ${{ inputs.mode || '' }}
          RELEASE_PROJECT: ${{ inputs.project || '' }}
        run: >-
          pnpm release:plan
          "$RELEASE_PROJECT"
          "$RELEASE_MODE"
          "$RELEASE_BASE_COMMIT"

  verify:
    name: Verify Release Candidates
    needs: plan
    if: ${{ github.event_name == 'push' || needs.plan.outputs.has_releases == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      release_build: true
      release_project: ${{ needs.plan.outputs.project_key }}

  release_repository:
    name: Release Repository
    needs:
      - plan
      - verify
    if: ${{ needs.plan.outputs.repository == 'true' && needs.verify.result == 'success' }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-package.yml
    with:
      mode: ${{ needs.plan.outputs.mode }}
      previous_version: ${{ needs.plan.outputs.repository_previous_version }}
      project: repository

  release_repository_fs:
    name: Release Repository FS
    needs:
      - plan
      - verify
      - release_repository
    if: >-
      ${{
        always() &&
        needs.plan.outputs.repository_fs == 'true' &&
        needs.verify.result == 'success' &&
        (needs.release_repository.result == 'success' ||
          needs.release_repository.result == 'skipped')
      }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-package.yml
    with:
      mode: ${{ needs.plan.outputs.mode }}
      previous_version: ${{ needs.plan.outputs.repository_fs_previous_version }}
      project: repository-fs

  release_core:
    name: Release Core
    needs:
      - plan
      - verify
      - release_repository
      - release_repository_fs
    if: >-
      ${{
        always() &&
        needs.plan.outputs.core == 'true' &&
        needs.verify.result == 'success' &&
        (needs.release_repository.result == 'success' ||
          needs.release_repository.result == 'skipped') &&
        (needs.release_repository_fs.result == 'success' ||
          needs.release_repository_fs.result == 'skipped')
      }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-package.yml
    with:
      mode: ${{ needs.plan.outputs.mode }}
      previous_version: ${{ needs.plan.outputs.core_previous_version }}
      project: core

  release_adapter_anthropic:
    name: Release Anthropic Adapter
    needs:
      - plan
      - verify
      - release_repository
      - release_repository_fs
      - release_core
    if: >-
      ${{
        always() &&
        needs.plan.outputs.adapter_anthropic == 'true' &&
        needs.verify.result == 'success' &&
        (needs.release_repository.result == 'success' ||
          needs.release_repository.result == 'skipped') &&
        (needs.release_repository_fs.result == 'success' ||
          needs.release_repository_fs.result == 'skipped') &&
        (needs.release_core.result == 'success' || needs.release_core.result == 'skipped')
      }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-package.yml
    with:
      mode: ${{ needs.plan.outputs.mode }}
      previous_version: ${{ needs.plan.outputs.adapter_anthropic_previous_version }}
      project: adapter-anthropic

  release_adapter_google_genai:
    name: Release Google Gen AI Adapter
    needs:
      - plan
      - verify
      - release_repository
      - release_repository_fs
      - release_core
      - release_adapter_anthropic
    if: >-
      ${{
        always() &&
        needs.plan.outputs.adapter_google_genai == 'true' &&
        needs.verify.result == 'success' &&
        (needs.release_repository.result == 'success' ||
          needs.release_repository.result == 'skipped') &&
        (needs.release_repository_fs.result == 'success' ||
          needs.release_repository_fs.result == 'skipped') &&
        (needs.release_core.result == 'success' || needs.release_core.result == 'skipped') &&
        (needs.release_adapter_anthropic.result == 'success' ||
          needs.release_adapter_anthropic.result == 'skipped')
      }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-package.yml
    with:
      mode: ${{ needs.plan.outputs.mode }}
      previous_version: ${{ needs.plan.outputs.adapter_google_genai_previous_version }}
      project: adapter-google-genai

  release_adapter_openai:
    name: Release OpenAI Adapter
    needs:
      - plan
      - verify
      - release_repository
      - release_repository_fs
      - release_core
      - release_adapter_anthropic
      - release_adapter_google_genai
    if: >-
      ${{
        always() &&
        needs.plan.outputs.adapter_openai == 'true' &&
        needs.verify.result == 'success' &&
        (needs.release_repository.result == 'success' ||
          needs.release_repository.result == 'skipped') &&
        (needs.release_repository_fs.result == 'success' ||
          needs.release_repository_fs.result == 'skipped') &&
        (needs.release_core.result == 'success' || needs.release_core.result == 'skipped') &&
        (needs.release_adapter_anthropic.result == 'success' ||
          needs.release_adapter_anthropic.result == 'skipped') &&
        (needs.release_adapter_google_genai.result == 'success' ||
          needs.release_adapter_google_genai.result == 'skipped')
      }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-package.yml
    with:
      mode: ${{ needs.plan.outputs.mode }}
      previous_version: ${{ needs.plan.outputs.adapter_openai_previous_version }}
      project: adapter-openai

  release_adapter_openai_agents_sdk:
    name: Release OpenAI Agents SDK Adapter
    needs:
      - plan
      - verify
      - release_repository
      - release_repository_fs
      - release_core
      - release_adapter_anthropic
      - release_adapter_google_genai
      - release_adapter_openai
    if: >-
      ${{
        always() &&
        needs.plan.outputs.adapter_openai_agents_sdk == 'true' &&
        needs.verify.result == 'success' &&
        (needs.release_repository.result == 'success' ||
          needs.release_repository.result == 'skipped') &&
        (needs.release_repository_fs.result == 'success' ||
          needs.release_repository_fs.result == 'skipped') &&
        (needs.release_core.result == 'success' || needs.release_core.result == 'skipped') &&
        (needs.release_adapter_anthropic.result == 'success' ||
          needs.release_adapter_anthropic.result == 'skipped') &&
        (needs.release_adapter_google_genai.result == 'success' ||
          needs.release_adapter_google_genai.result == 'skipped') &&
        (needs.release_adapter_openai.result == 'success' ||
          needs.release_adapter_openai.result == 'skipped')
      }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-package.yml
    with:
      mode: ${{ needs.plan.outputs.mode }}
      previous_version: ${{ needs.plan.outputs.adapter_openai_agents_sdk_previous_version }}
      project: adapter-openai-agents-sdk

  release_adapter_claude_agent_sdk:
    name: Release Claude Agent SDK Adapter
    needs:
      - plan
      - verify
      - release_repository
      - release_repository_fs
      - release_core
      - release_adapter_anthropic
      - release_adapter_google_genai
      - release_adapter_openai
      - release_adapter_openai_agents_sdk
    if: >-
      ${{
        always() &&
        needs.plan.outputs.adapter_claude_agent_sdk == 'true' &&
        needs.verify.result == 'success' &&
        (needs.release_repository.result == 'success' ||
          needs.release_repository.result == 'skipped') &&
        (needs.release_repository_fs.result == 'success' ||
          needs.release_repository_fs.result == 'skipped') &&
        (needs.release_core.result == 'success' || needs.release_core.result == 'skipped') &&
        (needs.release_adapter_anthropic.result == 'success' ||
          needs.release_adapter_anthropic.result == 'skipped') &&
        (needs.release_adapter_google_genai.result == 'success' ||
          needs.release_adapter_google_genai.result == 'skipped') &&
        (needs.release_adapter_openai.result == 'success' ||
          needs.release_adapter_openai.result == 'skipped') &&
        (needs.release_adapter_openai_agents_sdk.result == 'success' ||
          needs.release_adapter_openai_agents_sdk.result == 'skipped')
      }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-package.yml
    with:
      mode: ${{ needs.plan.outputs.mode }}
      previous_version: ${{ needs.plan.outputs.adapter_claude_agent_sdk_previous_version }}
      project: adapter-claude-agent-sdk

  release_adapter_cloudflare_agents:
    name: Release Cloudflare Agents Adapter
    needs:
      - plan
      - verify
      - release_repository
      - release_repository_fs
      - release_core
      - release_adapter_anthropic
      - release_adapter_google_genai
      - release_adapter_openai
      - release_adapter_openai_agents_sdk
      - release_adapter_claude_agent_sdk
    if: >-
      ${{
        always() &&
        needs.plan.outputs.adapter_cloudflare_agents == 'true' &&
        needs.verify.result == 'success' &&
        (needs.release_repository.result == 'success' ||
          needs.release_repository.result == 'skipped') &&
        (needs.release_repository_fs.result == 'success' ||
          needs.release_repository_fs.result == 'skipped') &&
        (needs.release_core.result == 'success' || needs.release_core.result == 'skipped') &&
        (needs.release_adapter_anthropic.result == 'success' ||
          needs.release_adapter_anthropic.result == 'skipped') &&
        (needs.release_adapter_google_genai.result == 'success' ||
          needs.release_adapter_google_genai.result == 'skipped') &&
        (needs.release_adapter_openai.result == 'success' ||
          needs.release_adapter_openai.result == 'skipped') &&
        (needs.release_adapter_openai_agents_sdk.result == 'success' ||
          needs.release_adapter_openai_agents_sdk.result == 'skipped') &&
        (needs.release_adapter_claude_agent_sdk.result == 'success' ||
          needs.release_adapter_claude_agent_sdk.result == 'skipped')
      }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-package.yml
    with:
      mode: ${{ needs.plan.outputs.mode }}
      previous_version: ${{ needs.plan.outputs.adapter_cloudflare_agents_previous_version }}
      project: adapter-cloudflare-agents

  release_adapter_vercel_ai_sdk:
    name: Release Vercel AI SDK Adapter
    needs:
      - plan
      - verify
      - release_repository
      - release_repository_fs
      - release_core
      - release_adapter_anthropic
      - release_adapter_google_genai
      - release_adapter_openai
      - release_adapter_openai_agents_sdk
      - release_adapter_claude_agent_sdk
      - release_adapter_cloudflare_agents
      - release_adapter_eve
    if: >-
      ${{
        always() &&
        needs.plan.outputs.adapter_vercel_ai_sdk == 'true' &&
        needs.verify.result == 'success' &&
        (needs.release_repository.result == 'success' ||
          needs.release_repository.result == 'skipped') &&
        (needs.release_repository_fs.result == 'success' ||
          needs.release_repository_fs.result == 'skipped') &&
        (needs.release_core.result == 'success' || needs.release_core.result == 'skipped') &&
        (needs.release_adapter_anthropic.result == 'success' ||
          needs.release_adapter_anthropic.result == 'skipped') &&
        (needs.release_adapter_google_genai.result == 'success' ||
          needs.release_adapter_google_genai.result == 'skipped') &&
        (needs.release_adapter_openai.result == 'success' ||
          needs.release_adapter_openai.result == 'skipped') &&
        (needs.release_adapter_openai_agents_sdk.result == 'success' ||
          needs.release_adapter_openai_agents_sdk.result == 'skipped') &&
        (needs.release_adapter_claude_agent_sdk.result == 'success' ||
          needs.release_adapter_claude_agent_sdk.result == 'skipped') &&
        (needs.release_adapter_cloudflare_agents.result == 'success' ||
          needs.release_adapter_cloudflare_agents.result == 'skipped') &&
        (needs.release_adapter_eve.result == 'success' ||
          needs.release_adapter_eve.result == 'skipped')
      }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-package.yml
    with:
      mode: ${{ needs.plan.outputs.mode }}
      previous_version: ${{ needs.plan.outputs.adapter_vercel_ai_sdk_previous_version }}
      project: adapter-vercel-ai-sdk

  release_adapter_eve:
    name: Release Eve Adapter
    needs:
      - plan
      - verify
      - release_repository
      - release_repository_fs
      - release_core
      - release_adapter_anthropic
      - release_adapter_google_genai
      - release_adapter_openai
      - release_adapter_openai_agents_sdk
      - release_adapter_claude_agent_sdk
      - release_adapter_cloudflare_agents
    if: >-
      ${{
        always() &&
        needs.plan.outputs.adapter_eve == 'true' &&
        needs.verify.result == 'success' &&
        (needs.release_repository.result == 'success' ||
          needs.release_repository.result == 'skipped') &&
        (needs.release_repository_fs.result == 'success' ||
          needs.release_repository_fs.result == 'skipped') &&
        (needs.release_core.result == 'success' || needs.release_core.result == 'skipped') &&
        (needs.release_adapter_anthropic.result == 'success' ||
          needs.release_adapter_anthropic.result == 'skipped') &&
        (needs.release_adapter_google_genai.result == 'success' ||
          needs.release_adapter_google_genai.result == 'skipped') &&
        (needs.release_adapter_openai.result == 'success' ||
          needs.release_adapter_openai.result == 'skipped') &&
        (needs.release_adapter_openai_agents_sdk.result == 'success' ||
          needs.release_adapter_openai_agents_sdk.result == 'skipped') &&
        (needs.release_adapter_claude_agent_sdk.result == 'success' ||
          needs.release_adapter_claude_agent_sdk.result == 'skipped') &&
        (needs.release_adapter_cloudflare_agents.result == 'success' ||
          needs.release_adapter_cloudflare_agents.result == 'skipped')
      }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-package.yml
    with:
      mode: ${{ needs.plan.outputs.mode }}
      previous_version: ${{ needs.plan.outputs.adapter_eve_previous_version }}
      project: adapter-eve

  release_cli:
    name: Release CLI
    needs:
      - plan
      - verify
      - release_repository
      - release_repository_fs
      - release_core
      - release_adapter_anthropic
      - release_adapter_google_genai
      - release_adapter_openai
      - release_adapter_openai_agents_sdk
      - release_adapter_claude_agent_sdk
      - release_adapter_cloudflare_agents
      - release_adapter_eve
      - release_adapter_vercel_ai_sdk
    if: >-
      ${{
        always() &&
        needs.plan.outputs.cli == 'true' &&
        needs.verify.result == 'success' &&
        (needs.release_repository.result == 'success' ||
          needs.release_repository.result == 'skipped') &&
        (needs.release_repository_fs.result == 'success' ||
          needs.release_repository_fs.result == 'skipped') &&
        (needs.release_core.result == 'success' || needs.release_core.result == 'skipped') &&
        (needs.release_adapter_anthropic.result == 'success' ||
          needs.release_adapter_anthropic.result == 'skipped') &&
        (needs.release_adapter_google_genai.result == 'success' ||
          needs.release_adapter_google_genai.result == 'skipped') &&
        (needs.release_adapter_openai.result == 'success' ||
          needs.release_adapter_openai.result == 'skipped') &&
        (needs.release_adapter_openai_agents_sdk.result == 'success' ||
          needs.release_adapter_openai_agents_sdk.result == 'skipped') &&
        (needs.release_adapter_claude_agent_sdk.result == 'success' ||
          needs.release_adapter_claude_agent_sdk.result == 'skipped') &&
        (needs.release_adapter_cloudflare_agents.result == 'success' ||
          needs.release_adapter_cloudflare_agents.result == 'skipped') &&
        (needs.release_adapter_eve.result == 'success' ||
          needs.release_adapter_eve.result == 'skipped') &&
        (needs.release_adapter_vercel_ai_sdk.result == 'success' ||
          needs.release_adapter_vercel_ai_sdk.result == 'skipped')
      }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-package.yml
    with:
      mode: ${{ needs.plan.outputs.mode }}
      previous_version: ${{ needs.plan.outputs.cli_previous_version }}
      project: cli

  release_website_ui:
    name: Release Website UI
    needs:
      - plan
      - verify
    if: ${{ needs.plan.outputs.website_ui == 'true' && needs.verify.result == 'success' }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-package.yml
    with:
      mode: ${{ needs.plan.outputs.mode }}
      previous_version: ${{ needs.plan.outputs.website_ui_previous_version }}
      project: website-ui
