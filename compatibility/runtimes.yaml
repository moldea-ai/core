version: 1
adapters:
  anthropic:
    implementation:
      kind: package
      package: '@moldea.ai/adapter-anthropic'
      distribution: public
      versionRange: '^2.0.0'
    implementationStatus: available
    supportedRepositoryFormatVersions:
      - 1
    compatibleCoreRange: '^2.0.0'
    runtimeGuidance:
      expectation: optional
      notes: Project-local guidance is needed only for repository-specific wrappers or unsupported indirect integration patterns.
    targets:
      - id: typescript-messages-api-0-117
        kind: package
        supportLevel: experimental
        language: typescript
        packages:
          - ecosystem: npm
            name: '@anthropic-ai/sdk'
            role: primary
            versionRange: '>=0.117.1 <0.118.0'
        evidenceKinds:
          - instruction-loader
          - language
          - runtime-package
          - runtime-pattern
          - schema
          - tool-registration
        bindingSupport:
          runtime-agent:
            relationship: full
            symbol: full
          instruction-loader:
            relationship: full
            symbol: full
          tool-registration:
            relationship: full
            symbol: full
          tool-input-schema:
            relationship: full
            symbol: full
        patterns:
          - id: direct-messages-create
            kind: runtime
            support: full
            description: Direct Anthropic Messages API invocation through a module-local client in a directly exported TypeScript function.
          - id: direct-system-loader
            kind: instruction-loader
            support: full
            description: A directly bound instruction loader supplies the top-level system request property.
          - id: closed-client-tool-array
            kind: tool
            support: full
            description: Closed inline or immutable module-local arrays contain statically declared Anthropic client tools.
          - id: direct-tool-input-schema
            kind: schema
            support: full
            description: A bound tool input schema is referenced directly through the client tool input_schema property.
          - id: dynamic-request-construction
            kind: runtime
            support: ambiguous
            description: Dynamically assembled Messages requests cannot be mapped reliably without semantic analysis.
          - id: provider-server-tools
            kind: tool
            support: unsupported
            description: Anthropic provider or server tools are outside the initial client-tool target.
        providerLimits:
          - id: client-tool-name
            subject: tool-name
            kind: pattern
            value: '^[A-Za-z0-9_-]{1,64}$'
            description: Anthropic client-tool names match the complete ASCII letter, digit, underscore, and hyphen pattern.
            reference: Anthropic Messages API reference for client tools.
        knownLimitations:
          - Arbitrary compiler resolution, path aliases, directory indexes, package exports, and re-export graphs are not resolved.
          - Beta resources, client.messages.stream, parse helpers, and tool-runner abstractions are not interpreted; an exact stream property on direct messages.create requests is tolerated, but its semantics are not validated.
          - Client-tool input-schema contents, including the provider-required top-level type object, are not validated; the target establishes only direct schema wiring.
          - Source forms outside the verified TypeScript ESM target, dynamic factories, mutable requests, provider tools, output schemas, runtime variables, and handoffs are outside the initial target.
        lastVerifiedAt: '2026-08-17'
    lastVerifiedAt: '2026-08-17'
  claude-agent-sdk:
    implementation:
      kind: package
      package: '@moldea.ai/adapter-claude-agent-sdk'
      distribution: public
    implementationStatus: planned
  cloudflare-agents:
    implementation:
      kind: package
      package: '@moldea.ai/adapter-cloudflare-agents'
      distribution: public
    implementationStatus: planned
  custom:
    implementation:
      kind: built-in
      package: '@moldea.ai/core'
      distribution: public
    implementationStatus: available
    supportedRepositoryFormatVersions:
      - 1
    compatibleCoreRange: '^2.0.0'
    runtimeGuidance:
      expectation: required
      notes: Project-local guidance defines the custom runtime integration.
    targets:
      - id: custom
        kind: custom
        supportLevel: supported
        language: any
        patterns:
          - id: explicit-repository-relationships
            kind: runtime
            support: full
            description: Universal Core validation of explicit repository relationships without runtime-specific inference.
        lastVerifiedAt: '2026-08-15'
    lastVerifiedAt: '2026-08-15'
  eve:
    implementation:
      kind: package
      package: '@moldea.ai/adapter-eve'
      distribution: public
    implementationStatus: planned
  google-genai:
    implementation:
      kind: package
      package: '@moldea.ai/adapter-google-genai'
      distribution: public
      versionRange: '^1.0.3'
    implementationStatus: available
    supportedRepositoryFormatVersions:
      - 1
    compatibleCoreRange: '^2.0.0'
    runtimeGuidance:
      expectation: optional
      notes: Project-local guidance is needed only for repository-specific wrappers or unsupported indirect integration patterns.
    targets:
      - id: typescript-models-generate-content-2
        kind: package
        supportLevel: experimental
        language: typescript
        packages:
          - ecosystem: npm
            name: '@google/genai'
            role: primary
            versionRange: '>=2.17.1 <3.0.0'
        evidenceKinds:
          - instruction-loader
          - language
          - runtime-package
          - runtime-pattern
          - schema
          - tool-registration
        bindingSupport:
          runtime-agent:
            relationship: full
            symbol: full
          instruction-loader:
            relationship: full
            symbol: full
          tool-registration:
            relationship: full
            symbol: full
          tool-input-schema:
            relationship: full
            symbol: full
        patterns:
          - id: direct-models-generate-content
            kind: runtime
            support: full
            description: Direct Google Gen AI models.generateContent invocation through a module-local client in a directly exported TypeScript function.
          - id: direct-config-system-instruction
            kind: instruction-loader
            support: full
            description: A directly bound instruction loader supplies config.systemInstruction in a closed generate-content request.
          - id: closed-function-declaration-tools
            kind: tool
            support: full
            description: Closed inline or immutable module-local collections expose statically declared functions through config.tools and functionDeclarations.
          - id: direct-parameters-json-schema
            kind: schema
            support: full
            description: A bound tool input schema is referenced directly through the function declaration parametersJsonSchema property.
          - id: dynamic-request-or-config
            kind: runtime
            support: ambiguous
            description: Dynamically assembled requests or configuration cannot be mapped reliably without semantic analysis.
          - id: alternative-parameters-schema
            kind: schema
            support: unsupported
            description: FunctionDeclaration.parameters and its OpenAPI-style Schema representation are outside the initial JSON-schema target.
          - id: callable-and-mcp-tools
            kind: tool
            support: unsupported
            description: Callable tools, MCP conversion helpers, and automatic tool execution are outside the initial static function-declaration target.
          - id: provider-server-tools
            kind: tool
            support: unsupported
            description: Google-hosted or provider/server tools do not establish version 1 repository-local manifest tool relationships.
          - id: streaming-chat-live-interactions
            kind: runtime
            support: unsupported
            description: Streaming generation, chat sessions, live sessions, and Interactions API calls are outside the initial direct generate-content target.
        providerLimits:
          - id: function-name-length
            subject: tool-name
            kind: max-unicode-scalars
            value: 128
            description: The Google Gen AI SDK FunctionDeclaration contract limits function names to 128 Unicode scalar values.
            reference: Google Gen AI SDK FunctionDeclaration reference.
          - id: function-name-pattern
            subject: tool-name
            kind: pattern
            value: '^[A-Za-z_][A-Za-z0-9_.:-]*$'
            description: The Google Gen AI SDK FunctionDeclaration contract uses the documented ASCII leading and continuation character set.
            reference: Google Gen AI SDK FunctionDeclaration reference.
          - id: function-declaration-count
            subject: other
            kind: other
            value: 512
            description: The Google Gen AI SDK Tool contract permits at most 512 function declarations in each closed functionDeclarations collection.
            reference: Google Gen AI SDK Tool reference.
        knownLimitations:
          - Arbitrary compiler resolution, path aliases, directory indexes, package exports, subpath imports, and re-export graphs are not resolved.
          - Constructor configuration, provider backend, API version, authentication mode, model selection, request contents, and response handling are not interpreted.
          - Backend-specific function-name restrictions are not validated; the published function-name rules cover only the version-matched SDK declaration contract.
          - Dynamic configuration, callable tools, MCP helpers, provider/server tools, automatic function execution, streaming, chats, live sessions, and Interactions API calls are outside the initial target.
          - Function input-schema contents, including top-level object shape and parameter-name restrictions, are not validated; the target establishes only direct parametersJsonSchema wiring.
          - Source forms outside the verified TypeScript ESM target, legacy @google/generative-ai, alternative parameters schemas, output schemas, runtime variables, and handoffs are outside the initial target.
        lastVerifiedAt: '2026-08-19'
    lastVerifiedAt: '2026-08-19'
  langchain:
    implementation:
      kind: package
      package: '@moldea.ai/adapter-langchain'
      distribution: public
    implementationStatus: planned
  langgraph:
    implementation:
      kind: package
      package: '@moldea.ai/adapter-langgraph'
      distribution: public
    implementationStatus: planned
  openai:
    implementation:
      kind: package
      package: '@moldea.ai/adapter-openai'
      distribution: public
      versionRange: '^2.0.0'
    implementationStatus: available
    supportedRepositoryFormatVersions:
      - 1
    compatibleCoreRange: '^2.0.0'
    runtimeGuidance:
      expectation: recommended
      notes: Document project-specific model selection, tool execution, streaming, retry, and error behavior that static inspection cannot establish.
    targets:
      - id: typescript-responses-api-7
        kind: package
        supportLevel: experimental
        language: typescript
        packages:
          - ecosystem: npm
            name: openai
            role: primary
            versionRange: '>=7.4.0 <8.0.0'
        evidenceKinds:
          - runtime-package
          - language
          - runtime-pattern
          - instruction-loader
          - tool-registration
          - schema
        bindingSupport:
          runtime-agent:
            relationship: full
            symbol: full
          instruction-loader:
            relationship: full
            symbol: full
          tool-registration:
            relationship: full
            symbol: full
          tool-input-schema:
            relationship: full
            symbol: full
        patterns:
          - id: direct-responses-runtime-agent
            kind: runtime
            support: full
            description: A bound exported TypeScript function uses a module-local OpenAI client for one or more direct Responses API object-literal requests with relationship-specific closure.
          - id: direct-instruction-loader
            kind: instruction-loader
            support: full
            description: A bound loader is called directly, optionally through await, by a Responses request instructions property.
          - id: static-function-tools
            kind: tool
            support: full
            description: Bound static OpenAI function-tool objects with the supported exact fields are included in a closed inline or immutable module-local Responses tools array.
          - id: direct-tool-input-schema
            kind: schema
            support: full
            description: A bound tool input schema is referenced directly by function-tool parameters.
          - id: dynamic-source-indirection
            kind: runtime
            support: ambiguous
            description: Factories, relationship-affecting computed properties and spreads, mutable arrays, and indirect request values remain unresolved.
          - id: chat-completions
            kind: runtime
            support: ambiguous
            description: Chat Completions usage is outside this target and is not rejected merely because Responses is preferred.
        knownLimitations:
          - Only TypeScript ESM files with supported direct default and relative named imports are interpreted.
          - Package versions are classified from nearest package manifests; lockfiles and installed node_modules are not inspected.
          - Source forms outside the verified TypeScript ESM target, Realtime, Assistants, Agents SDK, streaming semantics, and provider-hosted configuration are not interpreted.
          - Agent input and output schemas, tool implementations and output schemas, skills, variables, and runtime-native routing do not produce evidence.
        lastVerifiedAt: '2026-08-17'
    lastVerifiedAt: '2026-08-17'
  openai-agents-sdk:
    implementation:
      kind: package
      package: '@moldea.ai/adapter-openai-agents-sdk'
      distribution: public
      versionRange: '^1.0.0'
    implementationStatus: available
    supportedRepositoryFormatVersions:
      - 1
    compatibleCoreRange: '^2.0.0'
    runtimeGuidance:
      expectation: optional
      notes: Project-local guidance is needed only for repository-specific wrappers, dynamic graph construction, or unsupported indirect integration patterns.
    targets:
      - id: typescript-agent-handoffs-0-16
        kind: package
        supportLevel: experimental
        language: typescript
        packages:
          - ecosystem: npm
            name: '@openai/agents'
            role: primary
            versionRange: '>=0.16.1 <0.17.0'
        evidenceKinds:
          - agent-definition
          - handoff-registration
          - instruction-loader
          - language
          - runtime-package
          - schema
          - tool-registration
        bindingSupport:
          runtime-agent:
            relationship: full
            symbol: full
          output-schema:
            relationship: full
            symbol: full
          instruction-loader:
            relationship: full
            symbol: full
          tool-implementation:
            relationship: full
            symbol: full
          tool-registration:
            relationship: full
            symbol: full
          tool-input-schema:
            relationship: full
            symbol: full
          tool-output-schema:
            relationship: full
            symbol: full
        patterns:
          - id: direct-agent-construction
            kind: agent
            support: full
            description: A directly exported TypeScript const constructs an Agent through new Agent with one closed object-literal configuration.
          - id: agent-create-construction
            kind: agent
            support: full
            description: A directly exported TypeScript const constructs an Agent through Agent.create with one closed object-literal configuration.
          - id: direct-instruction-loader
            kind: instruction-loader
            support: full
            description: A declared instruction loader is used by direct call, direct reference, or one supported single-return dynamic-instruction wrapper.
          - id: direct-agent-output-schema
            kind: schema
            support: full
            description: A bound agent output schema is referenced directly through outputType.
          - id: closed-function-tool
            kind: tool
            support: full
            description: A directly exported function tool uses the root tool helper, an explicit normalized static name, direct implementation, and direct schema bindings.
          - id: closed-agent-tool-array
            kind: tool
            support: full
            description: Closed inline or immutable module-local arrays register supported function tools on an Agent.
          - id: direct-agent-handoff
            kind: routing
            support: full
            description: A source Agent registers a supported target Agent directly in its closed handoffs collection.
          - id: configured-handoff-helper
            kind: routing
            support: full
            description: A source Agent registers a supported target through handoff with optional closed name and description overrides.
          - id: effective-routing-description
            kind: routing
            support: full
            description: Target handoffDescription uses the canonical handoff description when present and the canonical agent-description fallback otherwise.
          - id: registration-description-override
            kind: routing
            support: full
            description: A non-empty static toolDescriptionOverride is authoritative for its handoff registration and must use the target effective routing description.
          - id: dynamic-agent-configuration
            kind: agent
            support: ambiguous
            description: Dynamically assembled Agent configurations cannot be mapped reliably without semantic analysis.
          - id: dynamic-routing-description
            kind: routing
            support: ambiguous
            description: Runtime-generated or transformed handoff descriptions and description overrides remain unestablished.
          - id: agents-as-tools
            kind: routing
            support: unsupported
            description: Agent-as-tool delegation retains manager control and is not interpreted as a handoff by the initial target.
          - id: hosted-and-mcp-tools
            kind: tool
            support: unsupported
            description: Hosted, MCP-generated, namespaced, and tool-search tools are outside the initial repository-local function-tool target.
          - id: realtime-and-sandbox-agents
            kind: agent
            support: unsupported
            description: Realtime and sandbox agent abstractions are outside the initial Agent target.
        knownLimitations:
          - Arbitrary compiler resolution, path aliases, directory indexes, package exports, CommonJS, and re-export graphs are not resolved.
          - Routing-description validation supports only static inline, immutable module-local, and directly imported static strings; loaders, file reads, transformations, and runtime-generated values remain unresolved.
          - Function tools require an explicit static name already in the initial normalized runtime subset; omitted names and names requiring SDK normalization are outside the target rather than invalid.
          - Handoff evidence reports a runtime name only for a supported static non-empty toolNameOverride that can be represented as a valid Runtime Adapter Contract machine string. SDK-generated default names and absent, empty, dynamic, unsupported, mutation-obscured, or evidence-unrepresentable overrides are reported as null.
          - Agent output, tool input, and tool output schema contents are not validated; the target establishes only direct schema wiring.
          - Handoff input schemas, callbacks, filters, enablement, runtime variables, guardrails, prompt templates, sessions, tracing, approvals, models, and provider behavior are not interpreted.
          - Custom Handoff objects, agents as tools, hosted tools, MCP tools, Realtime agents, sandbox agents, and dynamically assembled agent graphs are outside the initial target.
        lastVerifiedAt: '2026-08-19'
    lastVerifiedAt: '2026-08-19'
  vercel-ai-sdk:
    implementation:
      kind: package
      package: '@moldea.ai/adapter-vercel-ai-sdk'
      distribution: public
    implementationStatus: planned
