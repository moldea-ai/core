          - id: closed-function-declaration-tools
            kind: tool
            support: full
            description: Closed inline or immutable module-local collections expose statically declared functions through config.tools and functionDeclarations.
          - id: direct-parameters-json-schema
            kind: schema
            support: full
            description: A bound tool input schema is referenced directly through the function declaration parametersJsonSchema property.
          - id: dynamic-request-or-config
