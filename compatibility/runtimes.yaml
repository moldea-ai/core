version: 1
adapters:
  anthropic:
    implementation:
      kind: package
      package: '@moldea.ai/adapter-anthropic'
      distribution: public
      versionRange: '^2.0.0'
    implementationStatus: available
    supportedRepositoryFormatVersions:
      - 1
    compatibleCoreRange: '^2.0.0'
    runtimeGuidance:
      expectation: optional
      notes: Project-local guidance is needed only for repository-specific wrappers or unsupported indirect integration patterns.
    targets:
      - id: typescript-messages-api-0-117
        kind: package
        supportLevel: experimental
        language: typescript
        packages:
          - ecosystem: npm
            name: '@anthropic-ai/sdk'
            role: primary
            versionRange: '>=0.117.1 <0.118.0'
        evidenceKinds:
          - instruction-loader
          - language
          - runtime-package
          - runtime-pattern
          - schema
          - tool-registration
        bindingSupport:
          runtime-agent:
            relationship: full
            symbol: full
          instruction-loader:
            relationship: full
            symbol: full
          tool-registration:
            relationship: full
            symbol: full
          tool-input-schema:
            relationship: full
            symbol: full
        patterns:
          - id: direct-messages-create
            kind: runtime
            support: full
            description: Direct Anthropic Messages API invocation through a module-local client in a directly exported TypeScript function.
          - id: direct-system-loader
            kind: instruction-loader
            support: full
            description: A directly bound instruction loader supplies the top-level system request property.
          - id: closed-client-tool-array
            kind: tool
            support: full
            description: Closed inline or immutable module-local arrays contain statically declared Anthropic client tools.
          - id: direct-tool-input-schema
            kind: schema
            support: full
            description: A bound tool input schema is referenced directly through the client tool input_schema property.
          - id: dynamic-request-construction
            kind: runtime
            support: ambiguous
            description: Dynamically assembled Messages requests cannot be mapped reliably without semantic analysis.
          - id: provider-server-tools
            kind: tool
            support: unsupported
            description: Anthropic provider or server tools are outside the initial client-tool target.
        providerLimits:
          - id: client-tool-name
            subject: tool-name
            kind: pattern
            value: '^[A-Za-z0-9_-]{1,64}$'
            description: Anthropic client-tool names match the complete ASCII letter, digit, underscore, and hyphen pattern.
            reference: Anthropic Messages API reference for client tools.
        knownLimitations:
          - Arbitrary compiler resolution, path aliases, directory indexes, package exports, and re-export graphs are not resolved.
          - Beta resources, client.messages.stream, parse helpers, and tool-runner abstractions are not interpreted; an exact stream property on direct messages.create requests is tolerated, but its semantics are not validated.
          - Client-tool input-schema contents, including the provider-required top-level type object, are not validated; the target establishes only direct schema wiring.
          - Source forms outside the verified TypeScript ESM target, dynamic factories, mutable requests, provider tools, output schemas, runtime variables, and handoffs are outside the initial target.
        lastVerifiedAt: '2026-08-17'
    lastVerifiedAt: '2026-08-17'
  claude-agent-sdk:
    implementation:
      kind: package
      package: '@moldea.ai/adapter-claude-agent-sdk'
      distribution: public
    implementationStatus: planned
  cloudflare-agents:
    implementation:
      kind: package
      package: '@moldea.ai/adapter-cloudflare-agents'
      distribution: public
    implementationStatus: planned
  custom:
    implementation:
      kind: built-in
      package: '@moldea.ai/core'
      distribution: public
    implementationStatus: available
    supportedRepositoryFormatVersions:
      - 1
    compatibleCoreRange: '^2.0.0'
    runtimeGuidance:
      expectation: required
      notes: Project-local guidance defines the custom runtime integration.
    targets:
      - id: custom
        kind: custom
        supportLevel: supported
        language: any
        patterns:
          - id: explicit-repository-relationships
            kind: runtime
            support: full
            description: Universal Core validation of explicit repository relationships without runtime-specific inference.
        lastVerifiedAt: '2026-08-15'
    lastVerifiedAt: '2026-08-15'
  eve:
    implementation:
      kind: package
      package: '@moldea.ai/adapter-eve'
      distribution: public
    implementationStatus: planned
  google-genai:
    implementation:
      kind: package
      package: '@moldea.ai/adapter-google-genai'
      distribution: public
    implementationStatus: planned
  langchain:
    implementation:
      kind: package
      package: '@moldea.ai/adapter-langchain'
      distribution: public
    implementationStatus: planned
  langgraph:
    implementation:
      kind: package
      package: '@moldea.ai/adapter-langgraph'
      distribution: public
    implementationStatus: planned
  openai:
    implementation:
      kind: package
      package: '@moldea.ai/adapter-openai'
      distribution: public
      versionRange: '^2.0.0'
    implementationStatus: available
    supportedRepositoryFormatVersions:
      - 1
    compatibleCoreRange: '^2.0.0'
    runtimeGuidance:
      expectation: recommended
      notes: Document project-specific model selection, tool execution, streaming, retry, and error behavior that static inspection cannot establish.
    targets:
      - id: typescript-responses-api-7
        kind: package
        supportLevel: experimental
        language: typescript
        packages:
          - ecosystem: npm
            name: openai
            role: primary
            versionRange: '>=7.4.0 <8.0.0'
        evidenceKinds:
          - runtime-package
          - language
          - runtime-pattern
          - instruction-loader
          - tool-registration
          - schema
        bindingSupport:
          runtime-agent:
            relationship: full
            symbol: full
          instruction-loader:
            relationship: full
            symbol: full
          tool-registration:
            relationship: full
            symbol: full
          tool-input-schema:
            relationship: full
            symbol: full
        patterns:
          - id: direct-responses-runtime-agent
            kind: runtime
            support: full
            description: A bound exported TypeScript function uses a module-local OpenAI client for one or more direct Responses API object-literal requests with relationship-specific closure.
          - id: direct-instruction-loader
            kind: instruction-loader
            support: full
            description: A bound loader is called directly, optionally through await, by a Responses request instructions property.
          - id: static-function-tools
            kind: tool
            support: full
            description: Bound static OpenAI function-tool objects with the supported exact fields are included in a closed inline or immutable module-local Responses tools array.
          - id: direct-tool-input-schema
            kind: schema
            support: full
            description: A bound tool input schema is referenced directly by function-tool parameters.
          - id: dynamic-source-indirection
            kind: runtime
            support: ambiguous
            description: Factories, relationship-affecting computed properties and spreads, mutable arrays, and indirect request values remain unresolved.
          - id: chat-completions
            kind: runtime
            support: ambiguous
            description: Chat Completions usage is outside this target and is not rejected merely because Responses is preferred.
        knownLimitations:
          - Only TypeScript ESM files with supported direct default and relative named imports are interpreted.
          - Package versions are classified from nearest package manifests; lockfiles and installed node_modules are not inspected.
          - Source forms outside the verified TypeScript ESM target, Realtime, Assistants, Agents SDK, streaming semantics, and provider-hosted configuration are not interpreted.
          - Agent input and output schemas, tool implementations and output schemas, skills, variables, and runtime-native routing do not produce evidence.
        lastVerifiedAt: '2026-08-17'
    lastVerifiedAt: '2026-08-17'
  openai-agents-sdk:
    implementation:
      kind: package
      package: '@moldea.ai/adapter-openai-agents-sdk'
      distribution: public
    implementationStatus: planned
  vercel-ai-sdk:
    implementation:
      kind: package
      package: '@moldea.ai/adapter-vercel-ai-sdk'
      distribution: public
    implementationStatus: planned
